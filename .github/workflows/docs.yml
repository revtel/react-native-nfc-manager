name: Documentation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/**'
      - 'images/**'
      - 'README.md'
      - '.github/workflows/docs.yml'
  push:
    branches: [v4, main]
    paths:
      - 'docs/**'
      - 'images/**'
      - 'README.md'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install documentation dependencies
        run: npm ci --prefix docs
      - name: Build documentation
        env:
          DOCS_SOURCE_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: npm run build --prefix docs
      - name: Upload static preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation-site
          path: docs/.vitepress/dist
          if-no-files-found: error
          retention-days: 7
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy documentation
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
